name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  gate:
    name: bash -n · shellcheck · 17 suites
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Syntax — bash -n
        run: for f in deeploy.sh lib/*.sh tests/*.sh; do bash -n "$f"; done

      - name: Lint — shellcheck -x
        run: shellcheck -x deeploy.sh lib/*.sh tests/*.sh

      - name: Tests — 17 suites
        run: |
          rc=0
          for t in tests/test_*.sh; do
            echo "=== $t ==="
            bash "$t" || rc=1
          done
          exit $rc
