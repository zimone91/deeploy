name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

# Least privilege: the gate only reads the tree. (Release assets are produced
# by the separate release workflow, which scopes contents: write to itself.)
permissions:
  contents: read

# A superseded push has nothing left to prove — cancel its run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: bash -n · shellcheck · every suite
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      # Pinned to a full commit SHA (not a movable tag) — supply-chain hygiene
      # for a workflow that runs on every push.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Install shellcheck v0.11.0 (pinned + sha256-verified)
        # Pin the dev-gate version, with checksum verification. Ubuntu 24.04's apt
        # ships 0.9.0, whose older checks are false positives the repo lints clean
        # against on 0.11.0 (SC2317 on indirectly-invoked test mocks; SC2218 on
        # lib/start.sh functions that resolve at runtime after `source`). The sha256
        # is the official v0.11.0 linux.x86_64 release-asset digest; the step fails
        # closed on any mismatch.
        run: |
          ver=v0.11.0
          tarball="shellcheck-${ver}.linux.x86_64.tar.xz"
          sha256=8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198
          curl -fsSL -o "$tarball" "https://github.com/koalaman/shellcheck/releases/download/${ver}/${tarball}"
          echo "${sha256}  ${tarball}" | sha256sum -c -
          tar -xJf "$tarball"
          sudo install -m755 "shellcheck-${ver}/shellcheck" /usr/local/bin/shellcheck
          shellcheck --version

      - name: Syntax — bash -n
        run: for f in deeploy.sh get-deeploy.sh run_tests.sh lib/*.sh tests/*.sh; do bash -n "$f"; done

      - name: Lint — shellcheck -x
        run: shellcheck -x deeploy.sh get-deeploy.sh run_tests.sh lib/*.sh tests/*.sh

      - name: Tests — every suite
        run: |
          ./run_tests.sh

      - name: Tag == DEEPLOY_VERSION (release integrity)
        # A tagged build must carry the version it claims: vX.Y.Z must equal the
        # DEEPLOY_VERSION baked into lib/common.sh (rc1 shipped with a mismatch).
        if: github.ref_type == 'tag'
        run: |
          ver=$(sed -n 's/^DEEPLOY_VERSION="\${DEEPLOY_VERSION:-\([^}]*\)}"$/\1/p' lib/common.sh)
          test -n "$ver" || { echo "could not parse DEEPLOY_VERSION from lib/common.sh"; exit 1; }
          if [ "${GITHUB_REF_NAME}" != "v${ver}" ]; then
            echo "tag ${GITHUB_REF_NAME} != v${ver} (lib/common.sh) — fix the version or the tag"
            exit 1
          fi
          echo "tag ${GITHUB_REF_NAME} matches DEEPLOY_VERSION ${ver}"

          # The bootstrap carries its own default tag, because it must work when
          # downloaded straight from GitHub with no Cloudflare route to inject one.
          # That default is the URL a bare `sh get-deeploy.sh` fetches, so a stale
          # one silently installs the previous release. Gated here rather than
          # written down in a checklist.
          btag=$(sed -n 's/^TAG="\${DEEPLOY_INSTALL_TAG:-\([^}]*\)}"$/\1/p' get-deeploy.sh)
          test -n "$btag" || { echo "could not parse the default tag from get-deeploy.sh"; exit 1; }
          if [ "${GITHUB_REF_NAME}" != "$btag" ]; then
            echo "get-deeploy.sh defaults to ${btag}, not ${GITHUB_REF_NAME} — the one-command install would fetch the wrong release"
            exit 1
          fi
          echo "get-deeploy.sh default tag matches ${btag}"

          # The worker's DEFAULT_TAG is what the bare zim.one/deeploy path serves;
          # a stale one serves the previous release silently and forever. It is
          # determined by RUNNING the worker, not by grepping it: a sed over the
          # declaration reports the first quoted literal and is blind to anything
          # after it, so `const DEFAULT_TAG = 'v0.1.0-rc6'.replace('rc6','rc1')`
          # would read as green while the endpoint served another release.
          wtag=$(node --input-type=module -e '
            globalThis.fetch = async () => ({ ok: true, status: 200, arrayBuffer: async () => new ArrayBuffer(0) });
            const m = await import("./worker/index.mjs");
            const r = await m.default.fetch(new Request("https://zim.one/deeploy"));
            if (r.status !== 200) { console.error("the worker refuses its own default path: " + r.status); process.exit(1); }
            process.stdout.write(r.headers.get("x-deeploy-tag") || "");
          ')
          test -n "$wtag" || { echo "could not determine the worker default tag by running worker/index.mjs"; exit 1; }
          if [ "${GITHUB_REF_NAME}" != "$wtag" ]; then
            echo "the worker serves ${wtag}, not ${GITHUB_REF_NAME} — zim.one/deeploy would hand out the wrong release"
            exit 1
          fi
          echo "worker default tag matches ${wtag}"

          # The three checks above are equality against a parsed value; none of
          # them asks whether the tag is one the public install path can carry.
          # LC_ALL=C because A-Za-z is a collation range, not an ASCII range.
          printf '%s' "${GITHUB_REF_NAME}" | LC_ALL=C grep -qE '^v[0-9A-Za-z._-]{1,40}$' || {
            echo "tag ${GITHUB_REF_NAME} is outside the pattern the worker and get-deeploy.sh accept — the published install URL would be dead"
            exit 1
          }

  secrets:
    name: gitleaks (secret scan)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0   # scan the full history, not just the tip

      - name: Install gitleaks v8.30.1 (pinned + sha256-verified)
        # Same discipline as the shellcheck step: pinned release binary with the
        # official checksum, fail-closed on any mismatch.
        run: |
          ver=8.30.1
          tarball="gitleaks_${ver}_linux_x64.tar.gz"
          sha256=551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
          curl -fsSL -o "$tarball" "https://github.com/gitleaks/gitleaks/releases/download/v${ver}/${tarball}"
          echo "${sha256}  ${tarball}" | sha256sum -c -
          tar -xzf "$tarball" gitleaks
          sudo install -m755 gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Scan — gitleaks (fail-closed)
        run: gitleaks git --no-banner --redact --verbose .
