name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

# Least privilege: the gate only reads the tree. (Release assets are produced
# by the separate release workflow, which scopes contents: write to itself.)
permissions:
  contents: read

# A superseded push has nothing left to prove — cancel its run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: bash -n · shellcheck · 17 suites
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      # Pinned to a full commit SHA (not a movable tag) — supply-chain hygiene
      # for a workflow that runs on every push.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Install shellcheck v0.11.0 (pinned + sha256-verified)
        # Pin the dev-gate version, with checksum verification. Ubuntu 24.04's apt
        # ships 0.9.0, whose older checks are false positives the repo lints clean
        # against on 0.11.0 (SC2317 on indirectly-invoked test mocks; SC2218 on
        # lib/start.sh functions that resolve at runtime after `source`). The sha256
        # is the official v0.11.0 linux.x86_64 release-asset digest; the step fails
        # closed on any mismatch.
        run: |
          ver=v0.11.0
          tarball="shellcheck-${ver}.linux.x86_64.tar.xz"
          sha256=8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198
          curl -fsSL -o "$tarball" "https://github.com/koalaman/shellcheck/releases/download/${ver}/${tarball}"
          echo "${sha256}  ${tarball}" | sha256sum -c -
          tar -xJf "$tarball"
          sudo install -m755 "shellcheck-${ver}/shellcheck" /usr/local/bin/shellcheck
          shellcheck --version

      - name: Syntax — bash -n
        run: for f in deeploy.sh lib/*.sh tests/*.sh; do bash -n "$f"; done

      - name: Lint — shellcheck -x
        run: shellcheck -x deeploy.sh lib/*.sh tests/*.sh

      - name: Tests — 17 suites
        run: |
          rc=0
          for t in tests/test_*.sh; do
            echo "=== $t ==="
            bash "$t" || rc=1
          done
          exit $rc

      - name: Tag == DEEPLOY_VERSION (release integrity)
        # A tagged build must carry the version it claims: vX.Y.Z must equal the
        # DEEPLOY_VERSION baked into lib/common.sh (rc1 shipped with a mismatch).
        if: github.ref_type == 'tag'
        run: |
          ver=$(sed -n 's/^DEEPLOY_VERSION="\${DEEPLOY_VERSION:-\([^}]*\)}"$/\1/p' lib/common.sh)
          test -n "$ver" || { echo "could not parse DEEPLOY_VERSION from lib/common.sh"; exit 1; }
          if [ "${GITHUB_REF_NAME}" != "v${ver}" ]; then
            echo "tag ${GITHUB_REF_NAME} != v${ver} (lib/common.sh) — fix the version or the tag"
            exit 1
          fi
          echo "tag ${GITHUB_REF_NAME} matches DEEPLOY_VERSION ${ver}"

  secrets:
    name: gitleaks (secret scan)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0   # scan the full history, not just the tip

      - name: Install gitleaks v8.30.1 (pinned + sha256-verified)
        # Same discipline as the shellcheck step: pinned release binary with the
        # official checksum, fail-closed on any mismatch.
        run: |
          ver=8.30.1
          tarball="gitleaks_${ver}_linux_x64.tar.gz"
          sha256=551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
          curl -fsSL -o "$tarball" "https://github.com/gitleaks/gitleaks/releases/download/v${ver}/${tarball}"
          echo "${sha256}  ${tarball}" | sha256sum -c -
          tar -xzf "$tarball" gitleaks
          sudo install -m755 gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Scan — gitleaks (fail-closed)
        run: gitleaks git --no-banner --redact --verbose .
