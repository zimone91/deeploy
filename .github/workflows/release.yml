name: Release

# Tag-triggered release: run the gate (bash -n, shellcheck, the suites, and the
# tag == DEEPLOY_VERSION check), then build the source tarball + SHA256SUMS and
# attach both to a DRAFT GitHub release. Publishing stays a manual maintainer
# step. Tags are annotated but NOT GPG-signed during the release-candidate
# series — see CONTRIBUTING.
#
# The secret scan is deliberately NOT duplicated here: ci.yml runs gitleaks over
# the full history on the same tag push, and a workflow_dispatch rebuild packs a
# tree that push already scanned.
on:
  push:
    tags: ['v*']
  # Manual rebuild of an EXISTING tag, so a release can be re-cut without
  # moving a tag. The workflow body comes from the default branch; the tree
  # being built comes from the tag in `inputs.tag`.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to rebuild, e.g. v0.1.0-rc4'
        required: true

# contents: write is scoped to THIS workflow only (CI stays read-only) — it is
# required to create the release and upload assets.
permissions:
  contents: write

concurrency:
  # Keyed on the tag being built, not on the triggering ref, so two dispatches
  # for different tags do not collapse into one group.
  # NOTE: the expression is syntactically valid here (the workflow loads), but
  # whether `inputs.tag` actually resolves in this position is UNMEASURED — the
  # API does not expose the resolved group name. If it silently collapses, the
  # effect is serialised rebuilds, never a wrong artifact: correctness rests on
  # `ref:` and the tag==version gate, both of which are measured.
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false   # never cancel a half-published release

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          # on dispatch this is the ONLY thing that puts the tag's tree in the
          # runner; without it every later step would operate on the branch
          ref: ${{ inputs.tag || github.ref }}

      - name: Resolve the tag under build
        # inputs reach the shell as env, never as inline ${{ }} inside run:
        env:
          INPUT_TAG: ${{ inputs.tag }}
          PUSH_TAG: ${{ github.ref_name }}
        run: |
          tag="${INPUT_TAG:-$PUSH_TAG}"
          case "$tag" in
            v*) ;;
            *) echo "refusing to release: '${tag}' is not a v* tag"; exit 1 ;;
          esac
          echo "TAG=${tag}" >> "$GITHUB_ENV"

      - name: Install shellcheck v0.11.0 (pinned + sha256-verified)
        run: |
          ver=v0.11.0
          tarball="shellcheck-${ver}.linux.x86_64.tar.xz"
          sha256=8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198
          curl -fsSL -o "$tarball" "https://github.com/koalaman/shellcheck/releases/download/${ver}/${tarball}"
          echo "${sha256}  ${tarball}" | sha256sum -c -
          tar -xJf "$tarball"
          sudo install -m755 "shellcheck-${ver}/shellcheck" /usr/local/bin/shellcheck
          shellcheck --version

      - name: Gate — bash -n + shellcheck + suites
        run: |
          for f in deeploy.sh get-deeploy.sh run_tests.sh lib/*.sh tests/*.sh; do bash -n "$f"; done
          shellcheck -x deeploy.sh get-deeploy.sh run_tests.sh lib/*.sh tests/*.sh
          ./run_tests.sh

      - name: Gate — tag matches DEEPLOY_VERSION
        run: |
          ver=$(sed -n 's/^DEEPLOY_VERSION="\${DEEPLOY_VERSION:-\([^}]*\)}"$/\1/p' lib/common.sh)
          test -n "$ver" || { echo "could not parse DEEPLOY_VERSION from lib/common.sh"; exit 1; }
          if [ "${TAG}" != "v${ver}" ]; then
            echo "tag ${TAG} != v${ver} (lib/common.sh) — refusing to release"
            exit 1
          fi

          btag=$(sed -n 's/^TAG="\${DEEPLOY_INSTALL_TAG:-\([^}]*\)}"$/\1/p' get-deeploy.sh)
          test -n "$btag" || { echo "could not parse the default tag from get-deeploy.sh"; exit 1; }
          if [ "${TAG}" != "$btag" ]; then
            echo "get-deeploy.sh defaults to ${btag}, not ${TAG} — refusing to release a bootstrap that fetches another version"
            exit 1
          fi

          # The worker's DEFAULT_TAG is what the bare zim.one/deeploy path serves;
          # a stale one serves the previous release silently and forever. It is
          # determined by RUNNING the worker, not by grepping it: a sed over the
          # declaration reports the first quoted literal and is blind to anything
          # after it, so `const DEFAULT_TAG = 'v0.1.0-rc6'.replace('rc6','rc1')`
          # would read as green while the endpoint served another release.
          wtag=$(node --input-type=module -e '
            globalThis.fetch = async () => ({ ok: true, status: 200, arrayBuffer: async () => new ArrayBuffer(0) });
            const m = await import("./worker/index.mjs");
            const r = await m.default.fetch(new Request("https://zim.one/deeploy"));
            if (r.status !== 200) { console.error("the worker refuses its own default path: " + r.status); process.exit(1); }
            process.stdout.write(r.headers.get("x-deeploy-tag") || "");
          ')
          test -n "$wtag" || { echo "could not determine the worker default tag by running worker/index.mjs"; exit 1; }
          if [ "${TAG}" != "$wtag" ]; then
            echo "the worker serves ${wtag}, not ${TAG} — zim.one/deeploy would hand out the wrong release"
            exit 1
          fi

          # The three checks above are equality against a parsed value; none of
          # them asks whether the tag is one the public install path can carry.
          # LC_ALL=C because A-Za-z is a collation range, not an ASCII range.
          printf '%s' "${TAG}" | LC_ALL=C grep -qE '^v[0-9A-Za-z._-]{1,40}$' || {
            echo "tag ${TAG} is outside the pattern the worker and get-deeploy.sh accept — the published install URL would be dead"
            exit 1
          }

          # The README carries the install command a stranger copies. Nothing
          # checked it, so a release could ship a front page advertising the
          # previous version. Set comparison, not "contains": bump five of the
          # six literals and this is a two-element set that matches no tag.
          readme_tags=$(grep -oE 'v[0-9]+\.[0-9]+\.[0-9]+[-0-9A-Za-z.]*' README.md | sort -u)
          test -n "$readme_tags" || {
            echo "no version string found in README — was the install section reworded?"
            exit 1
          }
          if [ "$readme_tags" != "${TAG}" ]; then
            printf 'README advertises [%s], the tag is [%s]\n' "$(echo "$readme_tags" | tr "\n" " ")" "${TAG}"
            exit 1
          fi

      - name: Build tarball + SHA256SUMS
        # git archive of the COMMIT, not the checkout dir: reproducible content,
        # respects .gitattributes, and can never scoop untracked files. HEAD is
        # the tag's commit (checkout above pinned it), so this does not depend
        # on the tag object having been fetched into the runner.
        run: |
          git archive --format=tar.gz --prefix="deeploy-${TAG}/" -o "deeploy-${TAG}.tar.gz" HEAD
          sha256sum "deeploy-${TAG}.tar.gz" > SHA256SUMS
          cat SHA256SUMS

      - name: Compose the release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Computed, never typed. A digest maintained by hand in a file nothing
          # checks is the same defect as the assertion count that used to sit in
          # the README badge, except this one is what a reader checks us against.
          boot_sha=$(sha256sum get-deeploy.sh | cut -d' ' -f1)
          test -n "$boot_sha" || { echo "could not hash get-deeploy.sh"; exit 1; }

          # The lede IS the annotated tag's message. GitHub does not show a tag
          # body anywhere on the release page, so a warning written there — "not
          # yet run on hardware" — would otherwise reach nobody. Read through the
          # API rather than out of the checkout: the API returns what GitHub
          # stores, which is the same reason the tag was verified by object SHA
          # rather than by what the local repository happened to have.
          ref=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG}")
          tag_type=$(printf '%s' "$ref" | jq -r '.object.type')
          tag_sha=$(printf '%s' "$ref" | jq -r '.object.sha')
          if [ "$tag_type" != "tag" ]; then
            echo "${TAG} is a lightweight tag (${tag_type}); the release lede comes from the tag message, so there is nothing to publish"
            exit 1
          fi
          lede=$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${tag_sha}" --jq '.message')
          if [ "${#lede}" -lt 40 ]; then
            echo "the tag message for ${TAG} is ${#lede} characters — too short to be a release lede"
            printf 'got: [%s]\n' "$lede"
            exit 1
          fi

          # The lede is multi-line, so it is concatenated rather than substituted.
          # Piped through sed rather than `sed -i`: -i without an argument is
          # GNU-only, and a step that cannot be run outside the runner is a step
          # nobody checks before pushing a tag.
          {
          printf '%s\n\n' "$lede"
          cat <<'NOTES' | sed "s|__TAG__|${TAG}|g; s|__BOOTSHA__|${boot_sha}|g"
          ## Install

          ```sh
          sh -c "$(curl -sSfL https://zim.one/deeploy/__TAG__)"
          ```

          This downloads the release, verifies it against `SHA256SUMS`, hands the
          checkout to root and stops. **It does not deploy anything.** DeePloy wipes
          disks and rewrites GRUB; the command that starts that is one you type
          yourself, after reading what you are about to run as root.

          ## Verifying this release

          Two checks. They do not prove the same thing, and the difference is the
          whole reason both are here.

          **1. The tarball, against the manifest beside it.**

          ```sh
          sha256sum -c SHA256SUMS      # must print: OK
          ```

          Both files were produced by the same workflow run and are served from this
          same page, so this catches a download that was corrupted or tampered with
          in transit. It says nothing about where the release came from — whoever
          could replace one of them could replace the other.

          **2. The bootstrap, against the digest published here.**

          `get-deeploy.sh` is served from `zim.one`, which is not this page. That
          makes this the one check of the two that speaks to provenance rather than
          to transport.

          ```sh
          curl -sSfL https://zim.one/deeploy/__TAG__ | tail -n +2 | sha256sum
          # or, without coreutils:  ... | shasum -a 256
          ```

          must print

          ```
          __BOOTSHA__
          ```

          `tail -n +2` drops the single line the endpoint prepends to pin the
          version. Everything after it is `get-deeploy.sh` from this tag, byte for
          byte — which is what makes "the one-liner and the file you read are the
          same file" something you can check rather than something we assert.

          Tags are annotated but **not signed**, so a checksum here proves integrity,
          not authorship.

          ## Which files are ours

          Two: `deeploy-__TAG__.tar.gz` and `SHA256SUMS`. Those are what the release
          workflow builds and what the manifest covers.

          The "Source code (zip)" and "Source code (tar.gz)" links below are generated
          by GitHub, not by this workflow, and `SHA256SUMS` says nothing about them.
          Download one of those and you will have an archive with no checksum to check
          it against — which looks like an unverifiable release and is not one.

          ## Start here

          - [README](https://github.com/zimone91/deeploy/blob/__TAG__/README.md)
          - [docs/KEY-MODEL.md](https://github.com/zimone91/deeploy/blob/__TAG__/docs/KEY-MODEL.md) —
            what DeePloy does and does not do with your staked key. Read this one first.
          NOTES
          } > RELEASE_NOTES.md

          if grep -q '__TAG__\|__BOOTSHA__\|__LEDE__' RELEASE_NOTES.md; then
            echo "a placeholder survived into the release notes"
            exit 1
          fi
          cat RELEASE_NOTES.md

      - name: Create the DRAFT release, or refresh an existing draft's assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Set here, not left to whoever publishes. Publishing is then one flag
          # (--draft=false) with nothing to remember alongside it.
          pre=()
          case "${TAG}" in *-rc*|*-alpha*|*-beta*) pre=(--prerelease) ;; esac

          if gh release view "${TAG}" >/dev/null 2>&1; then
            if [ "$(gh release view "${TAG}" --json isDraft --jq '.isDraft')" != "true" ]; then
              echo "release ${TAG} is already PUBLISHED — refusing to touch its assets."
              echo "a rebuild is not guaranteed to be byte-identical (a different runner"
              echo "image or git version changes the gzip stream), so re-uploading could"
              echo "change SHA256SUMS under everyone who already recorded it."
              echo "Publish a new version instead of rewriting a published one."
              exit 1
            fi
            echo "draft ${TAG} already exists — replacing its assets and its notes"
            gh release upload "${TAG}" "deeploy-${TAG}.tar.gz" SHA256SUMS --clobber
            # The notes carry the bootstrap digest, so refreshing the assets
            # without refreshing them would publish a digest for a file that is
            # no longer the one attached.
            gh release edit "${TAG}" --notes-file RELEASE_NOTES.md "${pre[@]}"
          else
            gh release create "${TAG}" \
              --draft \
              "${pre[@]}" \
              --verify-tag \
              --title "DeePloy ${TAG}" \
              --notes-file RELEASE_NOTES.md \
              "deeploy-${TAG}.tar.gz" SHA256SUMS
          fi
