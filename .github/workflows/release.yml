name: Release

# Tag-triggered release: run the gate (bash -n, shellcheck, the suites, and the
# tag == DEEPLOY_VERSION check), then build the source tarball + SHA256SUMS and
# attach both to a DRAFT GitHub release. Publishing stays a manual maintainer
# step. Tags are annotated but NOT GPG-signed during the release-candidate
# series — see CONTRIBUTING.
#
# The secret scan is deliberately NOT duplicated here: ci.yml runs gitleaks over
# the full history on the same tag push, and a workflow_dispatch rebuild packs a
# tree that push already scanned.
on:
  push:
    tags: ['v*']
  # Manual rebuild of an EXISTING tag, so a release can be re-cut without
  # moving a tag. The workflow body comes from the default branch; the tree
  # being built comes from the tag in `inputs.tag`.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to rebuild, e.g. v0.1.0-rc4'
        required: true

# contents: write is scoped to THIS workflow only (CI stays read-only) — it is
# required to create the release and upload assets.
permissions:
  contents: write

concurrency:
  # Keyed on the tag being built, not on the triggering ref, so two dispatches
  # for different tags do not collapse into one group.
  # NOTE: the expression is syntactically valid here (the workflow loads), but
  # whether `inputs.tag` actually resolves in this position is UNMEASURED — the
  # API does not expose the resolved group name. If it silently collapses, the
  # effect is serialised rebuilds, never a wrong artifact: correctness rests on
  # `ref:` and the tag==version gate, both of which are measured.
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false   # never cancel a half-published release

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          # on dispatch this is the ONLY thing that puts the tag's tree in the
          # runner; without it every later step would operate on the branch
          ref: ${{ inputs.tag || github.ref }}

      - name: Resolve the tag under build
        # inputs reach the shell as env, never as inline ${{ }} inside run:
        env:
          INPUT_TAG: ${{ inputs.tag }}
          PUSH_TAG: ${{ github.ref_name }}
        run: |
          tag="${INPUT_TAG:-$PUSH_TAG}"
          case "$tag" in
            v*) ;;
            *) echo "refusing to release: '${tag}' is not a v* tag"; exit 1 ;;
          esac
          echo "TAG=${tag}" >> "$GITHUB_ENV"

      - name: Install shellcheck v0.11.0 (pinned + sha256-verified)
        run: |
          ver=v0.11.0
          tarball="shellcheck-${ver}.linux.x86_64.tar.xz"
          sha256=8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198
          curl -fsSL -o "$tarball" "https://github.com/koalaman/shellcheck/releases/download/${ver}/${tarball}"
          echo "${sha256}  ${tarball}" | sha256sum -c -
          tar -xJf "$tarball"
          sudo install -m755 "shellcheck-${ver}/shellcheck" /usr/local/bin/shellcheck
          shellcheck --version

      - name: Gate — bash -n + shellcheck + suites
        run: |
          for f in deeploy.sh run_tests.sh lib/*.sh tests/*.sh; do bash -n "$f"; done
          shellcheck -x deeploy.sh run_tests.sh lib/*.sh tests/*.sh
          ./run_tests.sh

      - name: Gate — tag matches DEEPLOY_VERSION
        run: |
          ver=$(sed -n 's/^DEEPLOY_VERSION="\${DEEPLOY_VERSION:-\([^}]*\)}"$/\1/p' lib/common.sh)
          test -n "$ver" || { echo "could not parse DEEPLOY_VERSION from lib/common.sh"; exit 1; }
          if [ "${TAG}" != "v${ver}" ]; then
            echo "tag ${TAG} != v${ver} (lib/common.sh) — refusing to release"
            exit 1
          fi

      - name: Build tarball + SHA256SUMS
        # git archive of the COMMIT, not the checkout dir: reproducible content,
        # respects .gitattributes, and can never scoop untracked files. HEAD is
        # the tag's commit (checkout above pinned it), so this does not depend
        # on the tag object having been fetched into the runner.
        run: |
          git archive --format=tar.gz --prefix="deeploy-${TAG}/" -o "deeploy-${TAG}.tar.gz" HEAD
          sha256sum "deeploy-${TAG}.tar.gz" > SHA256SUMS
          cat SHA256SUMS

      - name: Create the DRAFT release, or refresh an existing draft's assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${TAG}" >/dev/null 2>&1; then
            if [ "$(gh release view "${TAG}" --json isDraft --jq '.isDraft')" != "true" ]; then
              echo "release ${TAG} is already PUBLISHED — refusing to touch its assets."
              echo "a rebuild is not guaranteed to be byte-identical (a different runner"
              echo "image or git version changes the gzip stream), so re-uploading could"
              echo "change SHA256SUMS under everyone who already recorded it."
              echo "Publish a new version instead of rewriting a published one."
              exit 1
            fi
            echo "draft ${TAG} already exists — replacing its assets"
            gh release upload "${TAG}" "deeploy-${TAG}.tar.gz" SHA256SUMS --clobber
          else
            gh release create "${TAG}" \
              --draft \
              --verify-tag \
              --title "DeePloy ${TAG}" \
              --notes "Draft — see CHANGELOG.md. Verify: sha256sum -c SHA256SUMS" \
              "deeploy-${TAG}.tar.gz" SHA256SUMS
          fi
